[package]
name = "ps2-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust decoder for PlayStation 2 movies: PSS container, MPEG-1/MPEG-2 video, PCM and PS-ADPCM audio"
license = "GPL-3.0-only"
repository = "https://github.com/Nyaldee/ps2-video"
readme = "README.md"
keywords = ["ps2", "playstation", "mpeg2", "video", "decoder"]
categories = ["multimedia::video", "multimedia::audio", "game-development"]

[dependencies]

# Les tests décodent des vidéos entières : optimisés même en debug.
[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3
